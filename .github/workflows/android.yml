name: Android Build (otter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular versão automática por commit
        id: version
        run: |
          COMMITS=$(git rev-list --count HEAD)
          # Para o próximo commit gerar exatamente 1.1, defina BASE_COMMITS com o total de commits que já existem antes desta mudança
          BASE_COMMITS=0
          MINOR=$((COMMITS - BASE_COMMITS))
          if [ "$MINOR" -lt 1 ]; then MINOR=1; fi
          CODE=$((COMMITS + 1))
          NAME="1.${MINOR}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Gerando otter $NAME (versionCode=$CODE)"

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Aceitar licenças do Android SDK
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Garantir arquivo .env.example
        run: touch -a .env.example

      - name: Garantir debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Executar testes unitários e Robolectric
        run: gradle :app:testDebugUnitTest

      - name: Gerar APK de Debug
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: gradle :app:assembleDebug

      - name: Renomear APK com a versão
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/otter-${{ steps.version.outputs.name }}.apk"

      - name: Publicar APK de Debug
        uses: actions/upload-artifact@v4
        with:
          name: otter-${{ steps.version.outputs.name }}
          path: dist/otter-*.apk

      - name: Preparar keystore de Release (opcional)
        id: release_key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar APK e AAB de Release (opcional)
        if: steps.release_key.outputs.ready == 'true'
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease

      - name: Renomear arquivos de Release com a versão
        if: steps.release_key.outputs.ready == 'true'
        run: |
          mkdir -p dist-release
          cp app/build/outputs/apk/release/*.apk "dist-release/otter-${{ steps.version.outputs.name }}-release.apk"
          cp app/build/outputs/bundle/release/*.aab "dist-release/otter-${{ steps.version.outputs.name }}.aab"

      - name: Publicar artefatos de Release (opcional)
        if: steps.release_key.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: otter-${{ steps.version.outputs.name }}-release
          path: dist-release/*
